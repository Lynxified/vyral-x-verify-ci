name: Guildera Scraper

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source type (user/hashtag/keyword/url/cashtag)'
        required: false
        default: ''
        type: string
      target:
        description: 'Search target'
        required: false
        default: ''
        type: string
      max_results:
        description: 'Max results'
        required: false
        default: ''
        type: string
      media_only:
        description: 'Media only (true/false)'
        required: false
        default: ''
        type: string
      raw_query:
        description: 'Advanced search raw query'
        required: false
        default: ''
        type: string
      min_likes:
        description: 'Minimum likes filter'
        required: false
        default: '0'
        type: string
      min_retweets:
        description: 'Minimum retweets filter'
        required: false
        default: '0'
        type: string
      min_replies:
        description: 'Minimum replies filter'
        required: false
        default: '0'
        type: string
      min_views:
        description: 'Minimum views filter'
        required: false
        default: '0'
        type: string
      source_account:
        description: 'Filter by specific account (e.g. @my_mad89)'
        required: false
        default: ''
        type: string
      sort_by:
        description: 'Sort by: default, newest, oldest, likes, retweets, engagement, views'
        required: false
        default: 'default'
        type: string
      filter_replies:
        description: 'Post type filter: all, posts, replies'
        required: false
        default: 'all'
        type: string
      search_passes:
        description: 'Multi-pass search: comma-separated sort orders (e.g. top,live)'
        required: false
        default: ''
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Decode auth cookies
        run: node -e "const fs=require('fs'); fs.writeFileSync('state.json', Buffer.from(process.env.X_STATE,'base64').toString())"
        env:
          X_STATE: ${{ secrets.X_STATE }}
      - name: Run scraper
        run: node scraper.js
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_UPLOAD_KEY: ${{ secrets.WORDPRESS_UPLOAD_KEY }}
          SOURCE_TYPE: ${{ github.event.inputs.source_type || '' }}
          TARGET: ${{ github.event.inputs.target || '' }}
          MAX_RESULTS: ${{ github.event.inputs.max_results || '10' }}
          MEDIA_ONLY: ${{ github.event.inputs.media_only || 'false' }}
          RAW_QUERY: ${{ github.event.inputs.raw_query || '' }}
          KEY_HASH: ${{ secrets.KEY_HASH }}
          SEARCH_QUERY: ${{ github.event.inputs.target || '' }}
          MIN_LIKES: ${{ github.event.inputs.min_likes || '0' }}
          MIN_RETWEETS: ${{ github.event.inputs.min_retweets || '0' }}
          MIN_REPLIES: ${{ github.event.inputs.min_replies || '0' }}
          MIN_VIEWS: ${{ github.event.inputs.min_views || '0' }}
          SOURCE_ACCOUNT: ${{ github.event.inputs.source_account || '' }}
          SORT_BY: ${{ github.event.inputs.sort_by || 'default' }}
          FILTER_REPLIES: ${{ github.event.inputs.filter_replies || 'all' }}
          SEARCH_PASSES: ${{ github.event.inputs.search_passes || '' }}
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_PORT: ${{ secrets.PROXY_PORT }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
